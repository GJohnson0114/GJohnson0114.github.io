    <main>
        <h1>Contact Me</h1>
        <p class="contact-intro">Feel free to drop me a message using the form below!</p>

        <!-- Contact Form Container -->
        <!-- Replace 'your_formspree_id' with the actual ID you get in Step 2 -->
            <form action="https://formspree.io/f/mzdwvoda" method="POST" class="contact-form">

            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="6" required></textarea>
            </div>

            <button type="submit" class="submit-btn">Send Message</button>
        </form>
    </main>

</body>
